<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الدبل للخدمات</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,sans-serif;
background:#f5f5f5;
color:#222;
}

header{
background:#111;
color:white;
padding:22px 16px;
text-align:center;
}

.logo{
width:75px;
height:75px;
margin:auto;
border-radius:18px;
background:#f28c00;
display:flex;
align-items:center;
justify-content:center;
font-size:32px;
font-weight:bold;
}

header h1{
margin-top:12px;
font-size:25px;
}

header p{
margin-top:6px;
color:#ddd;
}

.container{
padding:18px;
max-width:650px;
margin:auto;
}

.welcome{
background:white;
border-radius:18px;
padding:20px;
margin-bottom:18px;
text-align:center;
box-shadow:0 3px 12px #0001;
}

.welcome h2{
margin-bottom:8px;
}

.section{
margin-bottom:22px;
}

.section-title{
font-size:21px;
font-weight:bold;
margin-bottom:12px;
}

.card{
background:white;
border-radius:17px;
padding:18px;
margin-bottom:12px;
box-shadow:0 3px 12px #0001;
}

.card
